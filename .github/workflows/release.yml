name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-22.04 # oldest supported glibc for broad distro compat
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev

      - name: Verify tag matches crate version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          [ "$TAG" = "$V" ] || { echo "tag v$TAG != Cargo.toml version $V"; exit 1; }

      - name: Build
        run: cargo build --release

      - name: Assemble tarball
        run: |
          DIR="voicegarden-spd-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/$DIR"
          cp target/release/sd_voicegarden \
             target/release/voicegarden-spd-refresh \
             target/release/voicegarden-spd \
             "dist/$DIR/"
          cp config/voicegarden-spd.conf scripts/install.sh README.md LICENSE "dist/$DIR/"
          chmod +x "dist/$DIR/install.sh" "dist/$DIR/sd_voicegarden" \
                   "dist/$DIR/voicegarden-spd-refresh" "dist/$DIR/voicegarden-spd"
          tar -C dist -czf "dist/${DIR}.tar.gz" "$DIR"
          # 'latest' alias so scripts/install.sh can use a stable URL.
          cp "dist/${DIR}.tar.gz" "dist/voicegarden-spd-latest-x86_64-linux.tar.gz"
          cp scripts/install.sh dist/install.sh

      - name: Smoke-test the tarball binary
        run: |
          dist/voicegarden-spd-${GITHUB_REF_NAME}-x86_64-linux/voicegarden-spd --version

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/install.sh
