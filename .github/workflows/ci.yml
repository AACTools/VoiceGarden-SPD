name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libspeechd-dev libclang-dev
      # The fake-server suite spawns sd_voicegarden and drives the real
      # libspeechd_module protocol — no daemon needed.
      - run: cargo test
      - name: Upload module binary for smoke job
        uses: actions/upload-artifact@v4
        with:
          name: module-debug
          path: target/debug/sd_voicegarden
          retention-days: 1

  speechd-smoke:
    name: Real speechd smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install speech-dispatcher + audio
        run: sudo apt-get update && sudo apt-get install -y speech-dispatcher spd-say pulseaudio pulseaudio-utils curl bzip2
      - name: Download module artifact
        uses: actions/download-artifact@v4
        with:
          name: module-debug
          path: bin
      - name: Start PulseAudio with a null sink
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio -D --exit-idle-time=-1 --disallow-exit 2>&1 || true
          sleep 1
          pactl info || (echo "pulse failed to start" && exit 1)
          pactl load-module module-null-sink sink_name=voicegarden || true

      - name: Register module with user speechd config
        run: |
          chmod +x bin/sd_voicegarden
          mkdir -p ~/.config/speech-dispatcher/modules
          cp config/voicegarden-spd.conf ~/.config/speech-dispatcher/modules/
          cat > ~/.config/speech-dispatcher/speechd.conf <<EOF
          AddModule "voicegarden-spd" "$GITHUB_WORKSPACE/bin/sd_voicegarden" "voicegarden-spd.conf"
          EOF

      - name: LIST VOICES with a stub model
        run: |
          mkdir -p ~/.rust-tts-wrapper/sherpaonnx/piper-nl-rdh-low
          touch ~/.rust-tts-wrapper/sherpaonnx/piper-nl-rdh-low/placeholder
          export XDG_RUNTIME_DIR=/tmp/xdg
          speech-dispatcher --spawn
          sleep 2
          spd-say -o voicegarden-spd -L | tee /tmp/voices.txt
          grep -q 'piper-nl-rdh-low#0' /tmp/voices.txt

      - name: SPEAK with a real model (end-to-end audio)
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg
          cd ~/.rust-tts-wrapper/sherpaonnx
          curl -fsSL -o piper.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-nl_BE-rdh-x_low.tar.bz2
          mkdir -p piper-nl-rdh-low
          tar -xjf piper.tar.bz2 -C piper-nl-rdh-low --strip-components=1
          rm piper.tar.bz2
          spd-say -o voicegarden-spd -y piper-nl-rdh-low#0 -w "Hello from the VoiceGarden speech dispatcher module."
