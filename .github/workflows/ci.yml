name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      # The speech-dispatcher protocol sources are vendored, so building
      # needs nothing beyond the Rust toolchain + a C compiler.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      # The fake-server suite spawns sd_voicegarden-spd and drives the real
      # (vendored) module protocol code — no daemon needed.
      - run: cargo test

  speechd-smoke:
    name: Real speechd smoke test (Debian, speechd 0.12)
    runs-on: ubuntu-latest
    needs: test
    container:
      # Ubuntu runners ship speech-dispatcher 0.11 (no server-side audio);
      # the module targets 0.12+. Debian trixie has 0.12.x.
      image: debian:trixie
    env:
      HOME: /root
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends
             ca-certificates curl bzip2 build-essential pkg-config
             speech-dispatcher speech-dispatcher-audio-plugins
             pulseaudio pulseaudio-utils git

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Build module + tools
        run: cargo build --bin sd_voicegarden-spd --bin voicegarden-spd

      - name: Start PulseAudio with a null sink
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio -D --exit-idle-time=-1 --disallow-exit 2>&1 || true
          sleep 1
          pactl info || (echo "pulse failed to start"; exit 1)
          pactl load-module module-null-sink sink_name=voicegarden || true

      - name: Install module into the user module directory (auto-detection)
        run: |
          # No speechd.conf is written: speech-dispatcher auto-detects
          # modules while no AddModule line exists (issue #2 regression
          # path). The binary name derives the module name
          # "voicegarden-spd".
          mkdir -p ~/.local/libexec/speech-dispatcher-modules \
                   ~/.config/speech-dispatcher/modules
          cp "$GITHUB_WORKSPACE/target/debug/sd_voicegarden-spd" \
             ~/.local/libexec/speech-dispatcher-modules/
          cp config/voicegarden-spd.conf ~/.config/speech-dispatcher/modules/

      - name: LIST VOICES with a stub model (and other modules intact)
        run: |
          mkdir -p ~/.rust-tts-wrapper/sherpaonnx/piper-nl_BE-rdh-low
          touch ~/.rust-tts-wrapper/sherpaonnx/piper-nl_BE-rdh-low/placeholder
          speech-dispatcher --spawn
          sleep 2
          spd-say -O | tee /tmp/modules.txt
          grep -q 'voicegarden-spd' /tmp/modules.txt
          # The whole point of the auto-detection install: other modules
          # (e.g. espeak-ng) must still be there (issue #2).
          if ls /usr/lib/*/speech-dispatcher-modules/sd_espeak-ng* >/dev/null 2>&1 \
             || ls /usr/lib/speech-dispatcher-modules/sd_espeak-ng* >/dev/null 2>&1; then
             grep -q 'espeak-ng' /tmp/modules.txt
          fi
          spd-say -o voicegarden-spd -L | tee /tmp/voices.txt
          grep -q 'piper-nl_BE-rdh-low#0' /tmp/voices.txt

      - name: Failed synthesis must surface as an error (issue #1)
        run: |
          # The stub model produces no audio: the module must answer SPEAK
          # with 301 ERROR CANT SPEAK so the daemon logs a real error
          # instead of playing back a silent success.
          spd-say -o voicegarden-spd -y piper-nl_BE-rdh-low#0 "this cannot synthesize"
          sleep 3
          LOG=/root/.cache/speech-dispatcher/log/speech-dispatcher.log
          [ -f "$LOG" ] || LOG="$XDG_RUNTIME_DIR/speech-dispatcher/log/speech-dispatcher.log"
          tail -n 50 "$LOG" || true
          grep -E "Can't say message|Module reported error" "$LOG" \
            || { echo "no module error logged for failed synthesis"; exit 1; }
          # Fresh daemon for the real-model run below.
          speech-dispatcher --terminate || pkill speech-dispatcher || true
          sleep 1

      - name: SPEAK with a real model (end-to-end audio)
        run: |
          cd ~/.rust-tts-wrapper/sherpaonnx
          curl -fsSL -o piper.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-nl_BE-rdh-x_low.tar.bz2
          mkdir -p piper-nl_BE-rdh-low
          tar -xjf piper.tar.bz2 -C piper-nl_BE-rdh-low --strip-components=1
          rm piper.tar.bz2
          speech-dispatcher --spawn
          sleep 2
          spd-say -o voicegarden-spd -y piper-nl_BE-rdh-low#0 -w "Hello from the VoiceGarden speech dispatcher module."

      - name: Bench (informational — cold vs warm synthesis)
        run: |
          "$GITHUB_WORKSPACE/target/debug/voicegarden-spd" bench \
            piper-nl_BE-rdh-low#0 "The quick brown fox jumps over the lazy dog." 3
