name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      # The speech-dispatcher protocol sources are vendored, so building
      # needs nothing beyond the Rust toolchain + a C compiler.
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      # The fake-server suite spawns sd_voicegarden and drives the real
      # (vendored) module protocol code — no daemon needed.
      - run: cargo test

  speechd-smoke:
    name: Real speechd smoke test (Debian, speechd 0.12)
    runs-on: ubuntu-latest
    needs: test
    container:
      # Ubuntu runners ship speech-dispatcher 0.11 (no server-side audio);
      # the module targets 0.12+. Debian trixie has 0.12.x.
      image: debian:trixie
    env:
      HOME: /root
      XDG_RUNTIME_DIR: /tmp/xdg
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends
             ca-certificates curl bzip2 build-essential pkg-config
             speech-dispatcher speech-dispatcher-audio-plugins
             pulseaudio pulseaudio-utils git

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Build module
        run: cargo build --bin sd_voicegarden

      - name: Start PulseAudio with a null sink
        run: |
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          pulseaudio -D --exit-idle-time=-1 --disallow-exit 2>&1 || true
          sleep 1
          pactl info || (echo "pulse failed to start"; exit 1)
          pactl load-module module-null-sink sink_name=voicegarden || true

      - name: Register module with user speechd config
        run: |
          mkdir -p ~/.config/speech-dispatcher/modules
          cp config/voicegarden-spd.conf ~/.config/speech-dispatcher/modules/
          cat > ~/.config/speech-dispatcher/speechd.conf <<EOF
          AddModule "voicegarden-spd" "$GITHUB_WORKSPACE/target/debug/sd_voicegarden" "voicegarden-spd.conf"
          EOF

      - name: LIST VOICES with a stub model
        run: |
          mkdir -p ~/.rust-tts-wrapper/sherpaonnx/piper-nl-rdh-low
          touch ~/.rust-tts-wrapper/sherpaonnx/piper-nl-rdh-low/placeholder
          speech-dispatcher --spawn
          sleep 2
          spd-say -o voicegarden-spd -L | tee /tmp/voices.txt
          grep -q 'piper-nl-rdh-low#0' /tmp/voices.txt

      - name: SPEAK with a real model (end-to-end audio)
        run: |
          cd ~/.rust-tts-wrapper/sherpaonnx
          curl -fsSL -o piper.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-nl_BE-rdh-x_low.tar.bz2
          mkdir -p piper-nl-rdh-low
          tar -xjf piper.tar.bz2 -C piper-nl-rdh-low --strip-components=1
          rm piper.tar.bz2
          spd-say -o voicegarden-spd -y piper-nl-rdh-low#0 -w "Hello from the VoiceGarden speech dispatcher module."
