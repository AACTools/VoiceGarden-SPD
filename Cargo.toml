[workspace]
resolver = "2"
members = ["crates/voicegarden-spd", "crates/voicegarden-cli"]

[workspace.dependencies]
# Pinned to a tagged rust-tts-wrapper release; bump on the next release.
rust-tts-wrapper = { git = "https://github.com/AACTools/rust-tts-wrapper", tag = "v0.4.1", default-features = false, features = [
    "sherpaonnx",
    "cloud",
    "floravox-lexicons",
] }

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/AACTools/VoiceGarden-SPD"
authors = ["will wade <willwade@gmail.com>"]

[profile.release]
lto = true
codegen-units = 1
strip = true
