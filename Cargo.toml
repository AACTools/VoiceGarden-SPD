[workspace]
resolver = "2"
members = ["crates/voicegarden-spd", "crates/voicegarden-cli"]

[workspace.dependencies]
# Pinned to a tagged rust-tts-wrapper release; bump on the next release.
rust-tts-wrapper = { git = "https://github.com/AACTools/rust-tts-wrapper", tag = "v1.0.0", default-features = false, features = [
    "cloud",
    "sherpaonnx",
] }
# Registry as typed data (model catalogue for voice search/download).
sherpa-onnx-models = "1.0.1"

[workspace.package]
version = "0.4.4"
edition = "2021"
license = "MIT"
repository = "https://github.com/AACTools/VoiceGarden-SPD"
authors = ["will wade <willwade@gmail.com>"]

[profile.release]
lto = true
codegen-units = 1
strip = true

sherpa-onnx-sys = { version = '=1.13.5' }
