[package]
name = "voicegarden-cli"
description = "voicegarden-spd management CLI: engines, credentials, voice search, install"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "voicegarden-spd"
path = "src/main.rs"

[dependencies]
voicegarden-spd = { path = "../voicegarden-spd" }
rust-tts-wrapper.workspace = true
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
