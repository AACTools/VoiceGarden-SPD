[package]
name = "voicegarden-spd"
description = "VoiceGarden speech-dispatcher output module: 1300+ sherpa-onnx local voices and 20 cloud engines for every speechd client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sd_voicegarden"
path = "src/main.rs"

[[bin]]
name = "voicegarden-spd-refresh"
path = "src/bin/refresh.rs"

[[bin]]
name = "voicegarden-spd"
path = "src/bin/vgctl.rs"

[dependencies]
rust-tts-wrapper = { git = "https://github.com/AACTools/rust-tts-wrapper", rev = "fb06fb2", default-features = false, features = [
    "sherpaonnx",
    "cloud",
] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
