[package]
name = "voicegarden-spd"
description = "VoiceGarden speech-dispatcher output module: 1300+ sherpa-onnx local voices and 20 cloud engines for every speechd client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
# Named sd_voicegarden-spd so speech-dispatcher's module auto-detection
# derives the module name "voicegarden-spd" from the binary (issue #2:
# an explicit AddModule line in a user speechd.conf disables
# auto-detection for every other module).
name = "sd_voicegarden-spd"
path = "src/main.rs"

[[bin]]
name = "voicegarden-spd-refresh"
path = "src/bin/refresh.rs"

[dependencies]
rust-tts-wrapper.workspace = true
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"
