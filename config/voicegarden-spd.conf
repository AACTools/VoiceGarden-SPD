# VoiceGarden-SPD module configuration.
#
# Installed as /etc/speech-dispatcher/modules/voicegarden-spd.conf (or
# ~/.config/speech-dispatcher/modules/). speech-dispatcher auto-detects
# the sd_voicegarden-spd binary from its module directories, so no
# speechd.conf change is needed. To register explicitly instead:
#   AddModule "voicegarden-spd" "sd_voicegarden-spd" "voicegarden-spd.conf"

# Directory containing downloaded sherpa-onnx models (one subdirectory per
# model id, as created by VoiceGarden / rust-tts-wrapper tooling). The
# legacy rust-tts-wrapper layout (~/.rust-tts-wrapper/sherpaonnx) is still
# scanned as a fallback; `voicegarden-spd migrate-models` moves models here.
ModelsDir "$HOME/.local/share/voicegarden/sherpa-onnx-models"

# JSON credentials file mapping engine id → credential object, e.g.
# { "azure": {"subscriptionKey": "...", "region": "uksouth"},
#   "openai": {"apiKey": "..."} }
# File should be mode 0600. Engines without credentials are skipped
# (except "edge", which needs none).
CredentialsFile "$HOME/.config/voicegarden-spd/engines.json"

# Voice-list cache populated by `voicegarden-spd-refresh`. The module
# never touches the network, so cloud voices only appear after a refresh.
VoiceCacheFile "$HOME/.cache/voicegarden-spd/voices.json"

# Voice used when the client's language/voice selection matches nothing.
# Format: "<model-id>#<speaker>" for sherpa-onnx voices or
# "<engine>/<voice-id>" for cloud voices.
#DefaultVoice "kokoro-en-v1.1-v0_19#1"

# Size of audio chunks streamed to the server (milliseconds). Smaller
# values improve stop/pause latency, larger values reduce overhead.
ChunkMs 250

# ONNX runtime threads used for sherpa-onnx synthesis.
NumThreads 2

# floravox drives every installed model (native SSML, SpeechMarkdown,
# measured word timings from the model's duration tensor, so index marks
# and word highlighting track the actual audio). Audio-LM model families
# (kitten, pocket, supertonic, zipvoice) are no longer spoken by this
# module as of v0.4.0 — they were removed with the sherpa-onnx engine to
# keep one onnxruntime in the binary; the 1,746 drivable families cover
# the same languages. (v0.3.x spoke them; downgrade if you need them.)
LocalEngine floravox

# Directory of named sound-icon files. When speech-dispatcher sends a
# SOUND_ICON message (e.g. "capital"), a file with that name here is
# played directly; otherwise the icon name is spoken. Debian's
# sound-icons package provides a standard set.
SoundIconFolder "/usr/share/sounds/sound-icons"
